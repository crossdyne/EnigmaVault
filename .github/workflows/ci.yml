name: CI

on:
  pull_request:

permissions:
  checks: write
  pull-requests: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      EnableWindowsTargeting: true 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: dotnet

      - name: Test backend
        id: test
        run: dotnet test --configuration Release --logger "trx;LogFileName=test-results.trx"
        working-directory: dotnet

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: success() || failure()
        with:
          files: "**/*.trx"
          fail_on: test failures
          comment_mode: changes
          check_name: "Backend Tests"

  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Desktop
        run: dotnet restore src/apps/EnigmaVault.Desktop/
        working-directory: dotnet

      - name: Build Desktop
        run: dotnet build src/apps/EnigmaVault.Desktop/ --configuration Release
        working-directory: dotnet
