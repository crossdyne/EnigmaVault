<ng-template #assetMenu let-icon="asset">
    <div class="icon-context-menu" cdkMenu>
        <button class="menu-item" (click)="selectedIcon.emit(icon)" cdkMenuItem>
            Установить
        </button>
    </div>
</ng-template>

<div class="assets-container">
    @for (group of groupedIcons(); track group.title) {
        <div class="icon-group">
            <h3 class="group-title">{{ group.title }}</h3>
            
            <div class="group-items">
                @for (icon of group.icons; track icon.assetId) {
                    <div 
                        class="svg-card-container"
                        [cdkContextMenuTriggerFor]="assetMenu"
                        [cdkContextMenuTriggerData]="{asset: icon}"
                        [appTooltip]="icon.assetName">
                        <img [src]="icon.url" [alt]="icon.assetName">
                        <!-- <span class="name">{{ icon.assetName }}</span> -->
                    </div>
                }
            </div>
        </div>
    } @empty {
        <div class="empty-state">Нет доступных иконок</div>
    }
</div>
