<button 
    type="button" 
    class="copy-btn" 
    (click)="copy()" 
    [disabled]="!value()"
    [attr.aria-label]="'Копировать'"
    [title]="copied() ? 'Скопировано!' : 'Копировать в буфер обмена'">

    @if (copied()) {
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="success-icon">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
    } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
        </svg>
    }
</button>
