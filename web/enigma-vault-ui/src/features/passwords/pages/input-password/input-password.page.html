<div class="form">
    <span>Введите пароль, это нужно для безопасной расшифровки ваших данных</span>
    <input [value]="password()" (input)="password.set($any($event.target).value)" type="password">
    <button (click)="submit()"><span>Продолжить</span></button>
    @if (errors()) {
        <span class="errors">{{ errors() }}</span>
    }
</div>
